# Public synthetic testing only. No paid services are created by this Blueprint.
# Free compute sleeps; database expires after30 days. No keep-alive workaround.
# Supply real sandbox providers/secrets; production auth is never bypassed.
services:
  - type: web
    name: preneura-public-test-web
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/karimelzoser/realestate
    branch: codex/egypt-platform-completion
    rootDir: platform
    autoDeployTrigger: off
    buildCommand: >-
      corepack enable && corepack prepare pnpm@12.9.1 --activate &&
      pnpm install --frozen-lockfile --prod=false && pnpm --filter @preneura/web build
    startCommand: pnpm --filter @preneura/web start
    healthCheckPath: /login
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_ENV
        value: public-test
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: preneura-public-test-backend
          type: web
          envVarKey: WEB_ORIGIN
      - key: PRENEURA_API_UPSTREAM
        sync: false
      - key: PRENEURA_EXPECTED_RELEASE_SHA
        fromService:
          name: preneura-public-test-backend
          type: web
          envVarKey: PRENEURA_EXPECTED_RELEASE_SHA

  - type: web
    name: preneura-public-test-backend
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/karimelzoser/realestate
    branch: codex/egypt-platform-completion
    rootDir: platform
    autoDeployTrigger: off
    buildCommand: >-
      corepack enable && corepack prepare pnpm@12.9.1 --activate &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @preneura/api build && pnpm --filter @preneura/worker build &&
      pnpm --filter @preneura/notification-gateway build
    startCommand: node --import ./packages/observability/dist/register.js deploy/render-preview.mjs
    healthCheckPath: /v1/health/ready
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: PRENEURA_DEPLOYMENT_PROFILE
        value: render-public-test
      - key: DATABASE_URL
        fromDatabase:
          name: preneura-public-test-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: PRENEURA_EXPECTED_RELEASE_SHA
        sync: false
      - key: MIGRATION_ACTOR
        value: render-public-test-bootstrap
      - key: MIGRATION_ADOPT_EXISTING
        value: 'false'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: API_BODY_LIMIT_BYTES
        value: '8388608'
      - key: AUTH_STEP_UP_BASE_MAX_AGE_SECONDS
        value: '600'
      - key: AUTH_IDENTIFIER_HMAC_KEY
        generateValue: true
      - key: AUTH_OTP_PEPPER
        generateValue: true
      - key: IDENTITY_DOCUMENT_HMAC_KEY
        generateValue: true
      - key: IDENTITY_RECOVERY_OTP_PEPPER
        generateValue: true
      - key: COOKIE_SIGNING_SECRET
        generateValue: true
      - key: CONTACT_HMAC_KEY
        generateValue: true
      - key: CONTACT_VERIFICATION_PEPPER
        generateValue: true
      - key: CONTACT_ENCRYPTION_KEY_BASE64
        generateValue: true
      - key: NOTIFICATION_GATEWAY_TOKEN
        generateValue: true
      - key: FINANCE_PROVIDER_INGRESS_TOKEN
        generateValue: true
      - key: SETTLEMENT_PROVIDER_INGRESS_TOKEN
        generateValue: true
      - key: OTP_PROVIDER
        value: gateway
      - key: OTP_CHANNEL
        value: whatsapp
      - key: AUTH_OTP_GATEWAY_URL
        value: http://127.0.0.1:4300/auth-otp
      - key: CONTACT_VERIFICATION_GATEWAY_URL
        value: http://127.0.0.1:4300/contact-verification
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OIDC_AAL2_ACR_VALUES
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: 'false'
      - key: DOCUMENT_SCANNER_URL
        sync: false
      - key: DOCUMENT_SCANNER_TOKEN
        sync: false
      - key: DOCUMENT_SCANNER_TIMEOUT_MS
        value: '20000'
      - key: META_GRAPH_API_VERSION
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_BINDINGS_JSON
        sync: false
      - key: WORKER_ID
        value: render-public-test
      - key: INVENTORY_LOCK_EXPIRY_SCAN_MS
        value: '1000'
      - key: INVENTORY_LOCK_EXPIRY_BATCH_SIZE
        value: '500'
      - key: OUTBOX_POLL_MS
        value: '300'
      - key: NOTIFICATION_POLL_MS
        value: '1000'
      - key: SLA_SCAN_MS
        value: '30000'
      - key: INSTALLMENT_REMINDER_SCAN_MS
        value: '30000'
      - key: COMMISSION_DUE_SCAN_MS
        value: '30000'
      - key: LOG_LEVEL
        value: info
      - key: OTEL_TRACES_EXPORTER
        value: otlp
      - key: OTEL_METRICS_EXPORTER
        value: otlp
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_EXPORTER_OTLP_INSECURE
        value: 'false'
      - key: OTEL_TRACE_SAMPLE_RATIO
        value: '0.1'
      - key: OTEL_EXPORTER_TIMEOUT_MS
        value: '10000'

databases:
  - name: preneura-public-test-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: preneura_public_test
    user: preneura_public_test
    ipAllowList: []
