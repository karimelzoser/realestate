services:
  - type: web
    runtime: node
    name: preneura-realestate-api-staging
    repo: https://github.com/karimelzoser/realestate
    branch: feature/production-runtime-readiness
    rootDir: platform
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @preneura/api build
    preDeployCommand: pnpm --filter @preneura/database migrate
    startCommand: pnpm --filter @preneura/api start
    healthCheckPath: /v1/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: preneura-realestate-db-staging
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: AUTH_IDENTIFIER_HMAC_KEY
        generateValue: true
      - key: AUTH_OTP_PEPPER
        generateValue: true
      - key: COOKIE_SIGNING_SECRET
        generateValue: true
      - key: CONTACT_ENCRYPTION_KEY_BASE64
        sync: false
      - key: CONTACT_HMAC_KEY
        generateValue: true
      - key: CONTACT_VERIFICATION_PEPPER
        generateValue: true
      - key: OIDC_ISSUER
        value: https://keycloak-production-77e5.up.railway.app/realms/preneura
      - key: OIDC_CLIENT_ID
        value: preneura-web
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OTP_CHANNEL
        value: sms
      - key: OTP_PROVIDER
        value: gateway
      - key: AUTH_OTP_GATEWAY_URL
        fromService:
          type: pserv
          name: preneura-realestate-notification-gateway-staging
          property: hostport
      - key: CONTACT_VERIFICATION_GATEWAY_URL
        fromService:
          type: pserv
          name: preneura-realestate-notification-gateway-staging
          property: hostport
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: DOCUMENT_SCANNER_URL
        sync: false
      - key: DOCUMENT_SCANNER_TOKEN
        sync: false
      - key: FINANCE_PROVIDER_INGRESS_TOKEN
        generateValue: true
      - key: NOTIFICATION_GATEWAY_TOKEN
        generateValue: true
      - key: AI_PROVIDER_URL
        value: ""
      - key: AI_PROVIDER_TOKEN
        value: ""

  - type: web
    runtime: node
    name: preneura-realestate-web-staging
    repo: https://github.com/karimelzoser/realestate
    branch: feature/production-runtime-readiness
    rootDir: platform
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @preneura/web build
    startCommand: pnpm --filter @preneura/web start
    healthCheckPath: /login
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: worker
    runtime: node
    name: preneura-realestate-worker-staging
    repo: https://github.com/karimelzoser/realestate
    branch: feature/production-runtime-readiness
    rootDir: platform
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @preneura/worker build
    startCommand: pnpm --filter @preneura/worker start
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: preneura-realestate-db-staging
          property: connectionString
      - key: NOTIFICATION_GATEWAY_URL
        fromService:
          type: pserv
          name: preneura-realestate-notification-gateway-staging
          property: hostport
      - key: NOTIFICATION_GATEWAY_TOKEN
        fromService:
          type: pserv
          name: preneura-realestate-notification-gateway-staging
          envVarKey: NOTIFICATION_GATEWAY_TOKEN
      - key: OUTBOX_POLL_MS
        value: "300"
      - key: NOTIFICATION_POLL_MS
        value: "1000"
      - key: SLA_SCAN_MS
        value: "30000"
      - key: INSTALLMENT_REMINDER_SCAN_MS
        value: "30000"
      - key: COMMISSION_DUE_SCAN_MS
        value: "30000"

  - type: pserv
    runtime: node
    name: preneura-realestate-notification-gateway-staging
    repo: https://github.com/karimelzoser/realestate
    branch: feature/production-runtime-readiness
    rootDir: platform
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @preneura/notification-gateway build
    startCommand: pnpm --filter @preneura/notification-gateway start
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4300"
      - key: DATABASE_URL
        fromDatabase:
          name: preneura-realestate-db-staging
          property: connectionString
      - key: NOTIFICATION_GATEWAY_TOKEN
        generateValue: true
      - key: CONTACT_ENCRYPTION_KEY_BASE64
        sync: false
      - key: META_GRAPH_API_VERSION
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_BINDINGS_JSON
        sync: false
      - key: SMS_PROVIDER_URL
        value: ""
      - key: SMS_PROVIDER_TOKEN
        value: ""
      - key: EMAIL_PROVIDER_URL
        value: ""
      - key: EMAIL_PROVIDER_TOKEN
        value: ""

databases:
  - name: preneura-realestate-db-staging
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: preneura_realestate_staging
    user: preneura
    ipAllowList: []
