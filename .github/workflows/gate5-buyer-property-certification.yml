name: Gate 5 Buyer Property Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/property/**"
      - "platform/apps/web/app/workspace/property/**"
      - "platform/apps/web/app/workspace/workspace-operations-shortcuts.tsx"
      - "platform/packages/contracts/src/property.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/tests/gate5_buyer_property_fixture.sql"
      - "platform/scripts/certify-gate5-buyer-property.mjs"
      - ".github/workflows/gate5-buyer-property-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/api/src/property/**"
      - "platform/apps/web/app/workspace/property/**"
      - "platform/apps/web/app/workspace/workspace-operations-shortcuts.tsx"
      - "platform/packages/contracts/src/property.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/tests/gate5_buyer_property_fixture.sql"
      - "platform/scripts/certify-gate5-buyer-property.mjs"
      - ".github/workflows/gate5-buyer-property-certification.yml"

permissions:
  contents: read

jobs:
  buyer-property:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura_gate5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura_gate5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_gate5
      PGPASSWORD: postgres
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build property authority graph
        run: |
          set -euo pipefail
          pnpm --filter @preneura/api... build
          pnpm --filter @preneura/web... build

      - name: Apply canonical migrations
        run: MIGRATION_ACTOR=gate5-buyer-property pnpm --filter @preneura/database migrate

      - name: Seed isolated buyer property fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/tests/gate5_buyer_property_fixture.sql

      - name: Certify self ownership and ledger-derived installments
        run: node scripts/certify-gate5-buyer-property.mjs
