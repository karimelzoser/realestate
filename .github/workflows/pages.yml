name: Deploy PRENEURA Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Validate release
        run: |
          node --check src/features/local-voice-agent/config64.js
          node --check src/features/local-voice-agent/engine.js
          node --check src/features/local-voice-agent/audio.js
          node --check src/features/local-voice-agent/index.js
          node --check src/features/local-voice-agent/lifecycle.js
          node --check src/features/production-ops/index.js
          node --check src/features/manager-live/index.js
          python3 -m py_compile local_voice_agent/server.py local_voice_agent/server64.py
          node scripts/validate.mjs
          node scripts/validate-model.mjs
          node scripts/validate-role-policy.mjs
          node scripts/validate-state.mjs
          node scripts/validate-release.mjs
          node scripts/validate-flow-preview.mjs
          node scripts/validate-local-voice-agent.mjs
          node scripts/validate-production-ops.mjs
          node scripts/validate-manager-live.mjs
      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R app _site/app
          cp -R src _site/src
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
