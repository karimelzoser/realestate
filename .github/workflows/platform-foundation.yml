name: Production Platform Foundation

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"
  push:
    branches:
      - "feature/production-foundation-auth"
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
