name: Production Platform Foundation

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"
      - ".github/workflows/release-reproducibility.yml"
  push:
    branches:
      - "feature/production-*"
      - "integration/software-ready-for-deployment"
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"
      - ".github/workflows/release-reproducibility.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build production applications
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/worker build
          pnpm --filter @preneura/notification-gateway build
          pnpm --filter @preneura/web build

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply migrations from zero
        env:
          PGPASSWORD: postgres
        run: |
          for migration in platform/packages/database/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d preneura -f "$migration"
          done
      - name: Verify production domain constraints
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d preneura <<'SQL'
          SELECT to_regclass('public.tenants') IS NOT NULL AS tenants_exists;
          SELECT to_regclass('public.access_role_assignments') IS NOT NULL AS access_exists;
          SELECT to_regclass('public.catalog_unit_types') IS NOT NULL AS catalog_exists;
          SELECT to_regclass('public.inventory_locks_one_active_per_slot') IS NOT NULL AS active_lock_unique_exists;
          SELECT to_regclass('public.inventory_locks_one_active_per_physical_unit') IS NOT NULL AS exact_active_lock_unique_exists;
          SELECT to_regclass('public.buyer_eois') IS NOT NULL AS eoi_exists;
          SELECT to_regclass('public.transactions') IS NOT NULL AS transactions_exists;
          SELECT to_regclass('public.transaction_documents') IS NOT NULL AS documents_exists;
          SELECT to_regclass('public.payment_schedules') IS NOT NULL AS payments_exists;
          SELECT to_regclass('public.broker_commission_cases') IS NOT NULL AS commissions_exists;
          SELECT to_regclass('public.notification_jobs') IS NOT NULL AS notification_jobs_exists;
          SELECT to_regclass('public.realtime_events') IS NOT NULL AS realtime_events_exists;
          SELECT to_regclass('public.platform_runtime_contract') IS NOT NULL AS runtime_contract_exists;
          SELECT schema_version, minimum_runtime_version, migration_marker
          FROM platform_runtime_contract
          WHERE singleton_key = 'production';
          SQL
