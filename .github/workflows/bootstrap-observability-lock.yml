name: Bootstrap Observability Lockfile

on:
  push:
    branches:
      - "feature/production-observability-security"
    paths:
      - "platform/apps/api/package.json"
      - "platform/apps/worker/package.json"
      - "platform/apps/notification-gateway/package.json"
      - "platform/packages/observability/**"
      - ".github/workflows/bootstrap-observability-lock.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-observability-security
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve workspace lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile update
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet -- platform/pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/pnpm-lock.yaml
          git commit -m "chore(deps): lock observability and HTTP security dependencies"
          git push origin HEAD:feature/production-observability-security
