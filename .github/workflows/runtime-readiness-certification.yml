name: Runtime Readiness Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/health/**"
      - "platform/apps/worker/src/main.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/security/package.json"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/package.json"
      - "platform/scripts/certify-runtime-readiness.sh"
      - "platform/docs/runtime-readiness.md"
      - ".github/workflows/runtime-readiness-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/api/src/health/**"
      - "platform/apps/worker/src/main.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/security/package.json"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/package.json"
      - "platform/scripts/certify-runtime-readiness.sh"
      - "platform/docs/runtime-readiness.md"
      - ".github/workflows/runtime-readiness-certification.yml"

permissions:
  contents: read

jobs:
  runtime-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build deployable runtime graph
        working-directory: platform
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm --filter @preneura/api... build
          pnpm --filter @preneura/worker... build

      - name: Certify current, stale and rolling-compatible runtime states
        working-directory: platform
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/certify-runtime-readiness.sh
