name: Runtime Readiness Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/health/**"
      - "platform/apps/worker/src/main.ts"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/package.json"
      - "platform/docs/runtime-readiness.md"
      - ".github/workflows/runtime-readiness-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/api/src/health/**"
      - "platform/apps/worker/src/main.ts"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/package.json"
      - "platform/docs/runtime-readiness.md"
      - ".github/workflows/runtime-readiness-certification.yml"

permissions:
  contents: read

jobs:
  runtime-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build runtime services
        working-directory: platform
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/worker build

      - name: Create readiness test databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for db in preneura_current preneura_stale preneura_future_compatible preneura_future_incompatible; do
            createdb -h 127.0.0.1 -U postgres "$db"
          done

          for migration in platform/packages/database/migrations/*.sql; do
            filename="$(basename "$migration")"
            if [[ "$filename" == "0033_runtime_readiness_contract.sql" ]]; then
              break
            fi
            psql -h 127.0.0.1 -U postgres -d preneura_stale -v ON_ERROR_STOP=1 -f "$migration"
          done

          for db in preneura_current preneura_future_compatible preneura_future_incompatible; do
            for migration in platform/packages/database/migrations/*.sql; do
              psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 -f "$migration"
            done
          done

          psql -h 127.0.0.1 -U postgres -d preneura_future_compatible -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE platform_runtime_contract
          SET schema_version = 34,
              minimum_runtime_version = 33,
              migration_marker = '0034_additive_future',
              updated_at = now()
          WHERE singleton_key = 'production';
          SQL

          psql -h 127.0.0.1 -U postgres -d preneura_future_incompatible -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE platform_runtime_contract
          SET schema_version = 34,
              minimum_runtime_version = 34,
              migration_marker = '0034_breaking_future',
              updated_at = now()
          WHERE singleton_key = 'production';
          SQL

      - name: Prove runtime contract cannot move backwards
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d preneura_current -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            BEGIN
              UPDATE platform_runtime_contract
              SET schema_version = 32
              WHERE singleton_key = 'production';
              RAISE EXCEPTION 'schema downgrade unexpectedly succeeded';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'schema downgrade unexpectedly succeeded' THEN RAISE; END IF;
            END;

            BEGIN
              UPDATE platform_runtime_contract
              SET minimum_runtime_version = 32
              WHERE singleton_key = 'production';
              RAISE EXCEPTION 'runtime compatibility downgrade unexpectedly succeeded';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'runtime compatibility downgrade unexpectedly succeeded' THEN RAISE; END IF;
            END;

            BEGIN
              DELETE FROM platform_runtime_contract WHERE singleton_key = 'production';
              RAISE EXCEPTION 'runtime contract deletion unexpectedly succeeded';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM = 'runtime contract deletion unexpectedly succeeded' THEN RAISE; END IF;
            END;
          END $$;
          SQL

      - name: Certify readiness compatibility matrix
        working-directory: platform
        run: |
          set -euo pipefail
          cat > apps/api/.runtime-readiness-certification.mts <<'TS'
          import { createDatabase } from '@preneura/database';
          import {
            assertRuntimeReadiness,
            RuntimeReadinessError,
          } from '@preneura/database/runtime-readiness';

          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) throw new Error('DATABASE_URL is required');
          const expectedCode = process.env.EXPECT_CODE;
          const expectedDatabaseSchemaVersion = process.env.EXPECT_DATABASE_SCHEMA_VERSION;
          const db = createDatabase(databaseUrl);

          try {
            const snapshot = await assertRuntimeReadiness(db);
            if (expectedCode) {
              throw new Error(`Expected readiness failure ${expectedCode}, but readiness passed.`);
            }
            if (
              expectedDatabaseSchemaVersion &&
              snapshot.databaseSchemaVersion !== Number(expectedDatabaseSchemaVersion)
            ) {
              throw new Error(
                `Expected database schema ${expectedDatabaseSchemaVersion}, got ${snapshot.databaseSchemaVersion}.`,
              );
            }
            console.log(JSON.stringify({ result: 'ready', ...snapshot }));
          } catch (error) {
            if (!expectedCode) throw error;
            if (!(error instanceof RuntimeReadinessError) || error.code !== expectedCode) {
              throw error;
            }
            console.log(JSON.stringify({ result: 'not_ready', code: error.code }));
          } finally {
            await db.destroy();
          }
          TS

          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_current' \
            EXPECT_DATABASE_SCHEMA_VERSION=33 \
            pnpm --filter @preneura/api exec tsx .runtime-readiness-certification.mts

          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_stale' \
            EXPECT_CODE=SCHEMA_CONTRACT_MISSING \
            pnpm --filter @preneura/api exec tsx .runtime-readiness-certification.mts

          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_future_compatible' \
            EXPECT_DATABASE_SCHEMA_VERSION=34 \
            pnpm --filter @preneura/api exec tsx .runtime-readiness-certification.mts

          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_future_incompatible' \
            EXPECT_CODE=RUNTIME_VERSION_TOO_OLD \
            pnpm --filter @preneura/api exec tsx .runtime-readiness-certification.mts

          rm apps/api/.runtime-readiness-certification.mts

      - name: Boot real API on current schema and require ready
        working-directory: platform
        env:
          NODE_ENV: test
          PORT: 4100
          WEB_ORIGIN: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_current
          OBJECT_STORAGE_BUCKET: readiness-test
        run: |
          set -euo pipefail
          pnpm --filter @preneura/api start >/tmp/preneura-api-current.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/preneura-api-current.log
              echo 'API exited before liveness became available.' >&2
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4100/v1/health/live >/tmp/live.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/preneura-api-current.log
            echo 'API did not become live within the startup window.' >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:4100/v1/health/live | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:4100/v1/health/ready >/tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"databaseSchemaVersion":33' /tmp/ready.json

          kill "$API_PID"
          wait "$API_PID" || true
          trap - EXIT

      - name: Boot real API on stale schema and require 503 readiness
        working-directory: platform
        env:
          NODE_ENV: test
          PORT: 4101
          WEB_ORIGIN: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_stale
          OBJECT_STORAGE_BUCKET: readiness-test
        run: |
          set -euo pipefail
          pnpm --filter @preneura/api start >/tmp/preneura-api-stale.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          live=0
          for attempt in {1..30}; do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/preneura-api-stale.log
              echo 'Stale-schema API exited before liveness became available.' >&2
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4101/v1/health/live >/tmp/stale-live.json; then
              live=1
              break
            fi
            sleep 1
          done
          if [[ "$live" -ne 1 ]]; then
            cat /tmp/preneura-api-stale.log
            echo 'Stale-schema API did not become live within the startup window.' >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:4101/v1/health/live | grep -q '"status":"ok"'

          status="$(curl --silent --output /tmp/stale-ready.json --write-out '%{http_code}' http://127.0.0.1:4101/v1/health/ready)"
          test "$status" = '503'
          grep -q '"status":"not_ready"' /tmp/stale-ready.json
          grep -q 'SCHEMA_CONTRACT_MISSING' /tmp/stale-ready.json

          kill "$API_PID"
          wait "$API_PID" || true
          trap - EXIT

      - name: Worker must fail stale and start current
        working-directory: platform
        run: |
          set -euo pipefail

          set +e
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_stale' \
            timeout --signal=TERM --kill-after=2s 8s pnpm --filter @preneura/worker start >/tmp/worker-stale.log 2>&1
          stale_rc=$?
          set -e
          if [[ "$stale_rc" -eq 0 || "$stale_rc" -eq 124 || "$stale_rc" -eq 137 ]]; then
            cat /tmp/worker-stale.log
            echo 'Worker did not fail closed on the stale schema.' >&2
            exit 1
          fi
          grep -q 'worker.fatal' /tmp/worker-stale.log
          grep -q 'Runtime schema contract is not available' /tmp/worker-stale.log

          set +e
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/preneura_current' \
            timeout --signal=TERM --kill-after=2s 5s pnpm --filter @preneura/worker start >/tmp/worker-current.log 2>&1
          current_rc=$?
          set -e
          if [[ "$current_rc" -ne 124 && "$current_rc" -ne 137 ]]; then
            cat /tmp/worker-current.log
            echo 'Current-schema worker exited unexpectedly.' >&2
            exit 1
          fi
          grep -q 'worker.ready' /tmp/worker-current.log
          grep -q '"databaseSchemaVersion":33' /tmp/worker-current.log
