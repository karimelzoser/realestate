name: Production Observability Certification

on:
  pull_request:
    paths:
      - "platform/packages/observability/**"
      - "platform/apps/api/package.json"
      - "platform/apps/api/src/main.ts"
      - "platform/apps/worker/package.json"
      - "platform/apps/worker/src/main.ts"
      - "platform/apps/notification-gateway/package.json"
      - "platform/pnpm-lock.yaml"
      - "platform/.env.example"
      - "platform/scripts/certify-observability.sh"
      - "platform/docs/observability.md"
      - "platform/README.md"
      - ".github/workflows/observability-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/packages/observability/**"
      - "platform/apps/api/package.json"
      - "platform/apps/api/src/main.ts"
      - "platform/apps/worker/package.json"
      - "platform/apps/worker/src/main.ts"
      - "platform/apps/notification-gateway/package.json"
      - "platform/pnpm-lock.yaml"
      - "platform/.env.example"
      - "platform/scripts/certify-observability.sh"
      - "platform/docs/observability.md"
      - "platform/README.md"
      - ".github/workflows/observability-certification.yml"

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build observable runtime graph
        working-directory: platform
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
          GITHUB_ACTIONS: "true"
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm --filter @preneura/observability build
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/worker build
          pnpm --filter @preneura/notification-gateway build

      - name: Certify telemetry export, correlation and redaction
        working-directory: platform
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/certify-observability.sh
