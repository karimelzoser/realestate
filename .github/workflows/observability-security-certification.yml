name: Gate 6 Observability & Security Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/**"
      - "platform/apps/worker/**"
      - "platform/apps/notification-gateway/**"
      - "platform/apps/web/lib/api.ts"
      - "platform/packages/observability/**"
      - "platform/pnpm-lock.yaml"
      - "platform/pnpm-workspace.yaml"
      - "platform/.env.example"
      - "platform/docs/observability-security.md"
      - "platform/scripts/certify-observability-security.mjs"
      - ".github/workflows/observability-security-certification.yml"
  push:
    branches:
      - "feature/production-*"
    paths:
      - "platform/apps/api/**"
      - "platform/apps/worker/**"
      - "platform/apps/notification-gateway/**"
      - "platform/apps/web/lib/api.ts"
      - "platform/packages/observability/**"
      - "platform/pnpm-lock.yaml"
      - "platform/pnpm-workspace.yaml"
      - "platform/.env.example"
      - "platform/docs/observability-security.md"
      - "platform/scripts/certify-observability-security.mjs"
      - ".github/workflows/observability-security-certification.yml"

permissions:
  contents: read

jobs:
  observability-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Apply production migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in packages/database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Build certified runtime graph
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4510
        run: |
          pnpm --filter @preneura/observability build
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/worker build
          pnpm --filter @preneura/notification-gateway build
          pnpm --filter @preneura/web build
      - name: Execute observability and HTTP security certification
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura
        run: node scripts/certify-observability-security.mjs
      - name: Verify gateway fails closed on stale schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres preneura_stale
          set +e
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/preneura_stale \
            OTEL_SDK_DISABLED=true \
            timeout 8s node --import ./apps/notification-gateway/dist/telemetry.js ./apps/notification-gateway/dist/bootstrap.js \
            > /tmp/gateway-stale.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            cat /tmp/gateway-stale.log
            echo "Notification gateway did not fail closed against stale schema." >&2
            exit 1
          fi
          echo "Notification gateway stale-schema startup rejection: VERIFIED"
