name: Gate 7 Production Go-No-Go

on:
  push:
    branches:
      - 'feature/production-gate7-*'
      - 'release/**'
    paths:
      - 'platform/**'
      - 'docs/PRODUCTION_DELIVERY_GATES.md'
      - '.github/workflows/full-stack-acceptance-certification.yml'
      - '.github/workflows/selfhosted-deployment-certification.yml'
      - '.github/workflows/gate7-evidence-contract.yml'
      - '.github/workflows/gate7-go-no-go.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'docs/PRODUCTION_DELIVERY_GATES.md'
      - '.github/workflows/full-stack-acceptance-certification.yml'
      - '.github/workflows/selfhosted-deployment-certification.yml'
      - '.github/workflows/gate7-evidence-contract.yml'
      - '.github/workflows/gate7-go-no-go.yml'
  workflow_dispatch:
    inputs:
      final_certification:
        description: 'Run final live Gate 7 certification'
        type: boolean
        required: true
        default: false
      deployed_release_sha:
        description: 'Exact certified deployment-bundle Git SHA running in production'
        type: string
        required: false
      api_url:
        description: 'Public API HTTPS base. Use https://host/api when API is behind PRENEURA edge, or a direct API origin.'
        type: string
        required: false
      web_url:
        description: 'Public PRENEURA web HTTPS origin'
        type: string
        required: false
      oidc_issuer_url:
        description: 'Production OIDC issuer HTTPS URL, including realm path when applicable'
        type: string
        required: false
      operational_owner:
        description: 'Named on-call/release operational owner'
        type: string
        required: false
      evidence_json:
        description: 'JSON object containing all 12 Gate 7 evidence references (HTTPS or approved ref prefixes); never place credentials here'
        type: string
        required: false
      tls_min_remaining_days:
        description: 'Minimum remaining validity required for public TLS certificates'
        type: number
        required: false
        default: 14

permissions:
  contents: read
  issues: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.9.1'

jobs:
  full-stack-acceptance:
    uses: ./.github/workflows/full-stack-acceptance-certification.yml

  self-hosted-deployment:
    uses: ./.github/workflows/selfhosted-deployment-certification.yml

  structural-preflight:
    needs:
      - full-stack-acceptance
      - self-hosted-deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Structural Gate 7 preflight
        run: node scripts/certify-gate7-preflight.mjs
      - name: Reject open P0/P1 launch defects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd ..
          p0="$(gh issue list --state open --search 'label:P0' --json number,title --jq 'length')"
          p1="$(gh issue list --state open --search 'label:P1' --json number,title --jq 'length')"
          if [ "$p0" -gt 0 ] || [ "$p1" -gt 0 ]; then
            echo "Open launch defects: P0=$p0 P1=$p1" >&2
            gh issue list --state open --search 'label:P0 OR label:P1' --json number,title,url --jq '.[] | "#\(.number) \(.title) \(.url)"' || true
            exit 1
          fi
          echo "No open P0/P1 issues found."

  final-live-certification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.final_certification }}
    needs: structural-preflight
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate live Gate 7 evidence
        env:
          DEPLOYED_RELEASE_SHA: ${{ inputs.deployed_release_sha }}
          API_URL: ${{ inputs.api_url }}
          WEB_URL: ${{ inputs.web_url }}
          OIDC_ISSUER_URL: ${{ inputs.oidc_issuer_url }}
          OPERATIONAL_OWNER: ${{ inputs.operational_owner }}
          GATE7_EVIDENCE_JSON: ${{ inputs.evidence_json }}
          GATE7_TLS_MIN_REMAINING_DAYS: ${{ inputs.tls_min_remaining_days }}
          REPORT_PATH: gate7-live-evidence.json
        run: node scripts/certify-gate7-live.mjs

      - name: Publish evidence summary
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('gate7-live-evidence.json', 'utf8'));
          console.log('# Gate 7 live certification');
          console.log('');
          console.log(`**Decision:** ${report.decision}`);
          console.log(`**Certified bundle:** \`${report.release.certifiedBundleSha}\``);
          console.log(`**Application runtime:** \`${report.release.applicationRuntimeSha}\``);
          console.log(`**Runtime schema:** ${report.release.runtimeSchemaVersion}`);
          console.log(`**Operational owner:** ${report.environment.operationalOwner}`);
          console.log(`**API:** ${report.environment.apiUrl}`);
          console.log(`**Web:** ${report.environment.webUrl}`);
          console.log(`**OIDC:** ${report.environment.oidcIssuer}`);
          console.log('');
          console.log('All required evidence categories were supplied as traceable references and all live DNS/TLS/API/Web/OIDC probes passed.');
          NODE

      - name: Upload immutable Gate 7 evidence report
        uses: actions/upload-artifact@v4
        with:
          name: gate7-live-evidence-${{ github.run_id }}
          path: platform/gate7-live-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Gate 7 decision
        env:
          OPERATIONAL_OWNER: ${{ inputs.operational_owner }}
          DEPLOYED_RELEASE_SHA: ${{ inputs.deployed_release_sha }}
        run: |
          echo 'GATE7_FINAL_DECISION=GO'
          echo 'DEPLOYMENT_MODE=self-hosted'
          echo "OPERATIONAL_OWNER=$OPERATIONAL_OWNER"
          echo "DEPLOYED_BUNDLE_SHA=$DEPLOYED_RELEASE_SHA"
          echo "CERTIFICATION_WORKFLOW_SHA=$GITHUB_SHA"
          echo "EVIDENCE_ARTIFACT=gate7-live-evidence-$GITHUB_RUN_ID"
