name: Integrate Gate 4 EOI Finance Source

on:
  push:
    branches:
      - feature/production-gate4-finance-integration
    paths:
      - .github/workflows/integrate-gate4-eoi-source.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port EOI finance source after settlement migrations
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f platform/packages/database/migrations/0039_eoi_projection_authority_one_shot.sql ]]; then
            echo 'EOI integration already present.'
            exit 0
          fi

          git fetch --no-tags origin feature/production-gate4-eoi-refund-finance:refs/remotes/origin/feature/production-gate4-eoi-refund-finance
          SOURCE=refs/remotes/origin/feature/production-gate4-eoi-refund-finance

          copy_from_source() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          }

          for path in \
            platform/apps/api/src/sales/eoi-finance.repository.ts \
            platform/apps/api/src/sales/eoi-finance.service.ts \
            platform/apps/api/src/sales/eoi-refund.controller.ts \
            platform/apps/api/src/sales/eoi-refund.repository.ts \
            platform/apps/api/src/sales/eoi-refund.service.ts \
            platform/apps/api/src/sales/sales.controller.ts \
            platform/apps/api/src/sales/sales.module.ts \
            platform/packages/contracts/src/sales.ts \
            platform/packages/database/tests/gate4_eoi_refund_finance_certification.sql \
            platform/docs/eoi-refund-finance.md
          do
            copy_from_source "$path"
          done

          # Preserve the settlement stack's canonical permission vocabulary.
          python - <<'PY'
          from pathlib import Path
          path = Path('platform/apps/api/src/sales/eoi-finance.service.ts')
          text = path.read_text()
          text = text.replace("permission: 'refund.payment.manage'", "permission: 'refund.payout.manage'")
          path.write_text(text)
          PY

          # Port the three EOI migrations after settlement's canonical 0034-0036 history.
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = 'refs/remotes/origin/feature/production-gate4-eoi-refund-finance'
          mappings = [
              ('0034_eoi_financial_evidence.sql', '0037_eoi_financial_evidence.sql', 34, 37, '0034_eoi_financial_evidence', '0037_eoi_financial_evidence'),
              ('0035_eoi_projection_guards_fail_closed.sql', '0038_eoi_projection_guards_fail_closed.sql', 35, 38, '0035_eoi_projection_guards_fail_closed', '0038_eoi_projection_guards_fail_closed'),
              ('0036_eoi_projection_authority_one_shot.sql', '0039_eoi_projection_authority_one_shot.sql', 36, 39, '0036_eoi_projection_authority_one_shot', '0039_eoi_projection_authority_one_shot'),
          ]
          outdir = Path('platform/packages/database/migrations')
          for src, dst, old, new, old_marker, new_marker in mappings:
              text = subprocess.check_output([
                  'git', 'show', f'{source}:platform/packages/database/migrations/{src}'
              ], text=True)
              text = text.replace(old_marker, new_marker)
              text = text.replace(f'schema_version = {old}', f'schema_version = {new}')
              text = text.replace(f'minimum_runtime_version = {old}', f'minimum_runtime_version = {new}')
              text = text.replace(f'schema {old}', f'schema {new}')
              outdir.joinpath(dst).write_text(text)
          PY

          # Final integrated runtime contract is schema 39.
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('platform/packages/database/src/runtime-readiness.ts')
          text = path.read_text()
          text = re.sub(r'export const RUNTIME_SCHEMA_VERSION = \d+;', 'export const RUNTIME_SCHEMA_VERSION = 39;', text)
          text = re.sub(
              r"export const RUNTIME_MIGRATION_MARKER = '[^']+';",
              "export const RUNTIME_MIGRATION_MARKER = '0039_eoi_projection_authority_one_shot';",
              text,
          )
          path.write_text(text)

          path = Path('platform/scripts/certify-runtime-readiness.sh')
          text = path.read_text()
          # Future compatibility test becomes schema 40 around runtime 39.
          text = re.sub(
              r"SET schema_version = \d+,\n    minimum_runtime_version = \d+,\n    migration_marker = '\d{4}_additive_future'",
              "SET schema_version = 40,\n    minimum_runtime_version = 39,\n    migration_marker = '0040_additive_future'",
              text,
              count=1,
          )
          text = re.sub(
              r"SET schema_version = \d+,\n    minimum_runtime_version = \d+,\n    migration_marker = '\d{4}_breaking_future'",
              "SET schema_version = 40,\n    minimum_runtime_version = 40,\n    migration_marker = '0040_breaking_future'",
              text,
              count=1,
          )
          # Monotonicity negative cases must move below the integrated schema.
          marker = 'prove_contract_monotonicity()'
          head, tail = text.split(marker, 1)
          tail = re.sub(r'SET schema_version = \d+', 'SET schema_version = 38', tail, count=1)
          tail = re.sub(r'SET minimum_runtime_version = \d+', 'SET minimum_runtime_version = 38', tail, count=1)
          text = head + marker + tail
          # Current/future expectations.
          text = re.sub(r'EXPECT_DATABASE_SCHEMA_VERSION=\d+', 'EXPECT_DATABASE_SCHEMA_VERSION=39', text, count=1)
          # The second expectation is the future-compatible database.
          pos = text.find('EXPECT_DATABASE_SCHEMA_VERSION=39')
          if pos != -1:
              rest = text[pos + len('EXPECT_DATABASE_SCHEMA_VERSION=39'):]
              rest = re.sub(r'EXPECT_DATABASE_SCHEMA_VERSION=\d+', 'EXPECT_DATABASE_SCHEMA_VERSION=40', rest, count=1)
              text = text[:pos + len('EXPECT_DATABASE_SCHEMA_VERSION=39')] + rest
          text = re.sub(r'\"databaseSchemaVersion\":\d+', '\"databaseSchemaVersion\":39', text)
          path.write_text(text)
          PY

          # Renumber explicit EOI migration/runtime references in its test and runbook.
          python - <<'PY'
          from pathlib import Path
          for filename in [
              'platform/packages/database/tests/gate4_eoi_refund_finance_certification.sql',
              'platform/docs/eoi-refund-finance.md',
          ]:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('0034_eoi_financial_evidence', '0037_eoi_financial_evidence')
              text = text.replace('0035_eoi_projection_guards_fail_closed', '0038_eoi_projection_guards_fail_closed')
              text = text.replace('0036_eoi_projection_authority_one_shot', '0039_eoi_projection_authority_one_shot')
              # Final runtime assertions in this EOI-specific content move to 39.
              text = text.replace('schema 36', 'schema 39')
              text = text.replace('schema_version = 36', 'schema_version = 39')
              text = text.replace('schema_version <> 36', 'schema_version <> 39')
              path.write_text(text)
          PY

          git add platform
          if git diff --cached --quiet; then
            echo 'No source integration changes to commit.'
            exit 0
          fi

          git config user.name 'preneura-integration-bot'
          git config user.email '81989794+karimelzoser@users.noreply.github.com'
          git commit -m 'feat(gate4): integrate EOI finance after settlement authority'
          git push origin HEAD:feature/production-gate4-finance-integration
