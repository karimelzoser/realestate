name: E03 Developer Onboarding Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/onboarding/**"
      - "platform/apps/api/src/accounts/account-bootstrap.service.ts"
      - "platform/apps/api/src/accounts/account.module.ts"
      - "platform/apps/api/src/app.module.ts"
      - "platform/apps/api/test/developer-onboarding.test.ts"
      - "platform/packages/contracts/src/onboarding.ts"
      - "platform/packages/contracts/src/index.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/database/migrations/0044_developer_onboarding.sql"
      - "platform/packages/database/tests/e03_developer_onboarding_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/apps/api/package.json"
      - "platform/pnpm-lock.yaml"
      - ".github/workflows/e03-developer-onboarding-certification.yml"
  push:
    branches:
      - "codex/egypt-platform-completion"
    paths:
      - "platform/apps/api/src/onboarding/**"
      - "platform/apps/api/src/accounts/account-bootstrap.service.ts"
      - "platform/apps/api/src/accounts/account.module.ts"
      - "platform/apps/api/src/app.module.ts"
      - "platform/apps/api/test/developer-onboarding.test.ts"
      - "platform/packages/contracts/src/onboarding.ts"
      - "platform/packages/contracts/src/index.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/database/migrations/0044_developer_onboarding.sql"
      - "platform/packages/database/tests/e03_developer_onboarding_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/apps/api/package.json"
      - "platform/pnpm-lock.yaml"
      - ".github/workflows/e03-developer-onboarding-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations from zero
        working-directory: platform
        run: |
          set -euo pipefail
          for migration in packages/database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

      - name: Certify developer onboarding database authority
        working-directory: platform
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/tests/e03_developer_onboarding_certification.sql

      - name: Run API security and onboarding tests
        working-directory: platform
        run: pnpm --filter @preneura/api test

      - name: Strict platform typecheck
        working-directory: platform
        run: pnpm typecheck

      - name: Build API
        working-directory: platform
        run: pnpm --filter @preneura/api build
