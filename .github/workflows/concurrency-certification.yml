name: Concurrency Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/catalog/**"
      - "platform/apps/api/src/sales/queue-dispatch.repository.ts"
      - "platform/apps/worker/src/notifications.ts"
      - "platform/apps/worker/src/notification-delivery.ts"
      - "platform/apps/worker/scripts/concurrency-certification.mjs"
      - "platform/apps/worker/scripts/resilience-certification.mjs"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/tests/concurrency_certification.mjs"
      - "platform/packages/database/tests/backup_restore_seed.sql"
      - "platform/docs/concurrency-certification.md"
      - "platform/docs/gate6-performance-resilience.md"
      - "platform/pnpm-lock.yaml"
      - ".github/workflows/concurrency-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/api/src/catalog/**"
      - "platform/apps/api/src/sales/queue-dispatch.repository.ts"
      - "platform/apps/worker/src/notifications.ts"
      - "platform/apps/worker/src/notification-delivery.ts"
      - "platform/apps/worker/scripts/concurrency-certification.mjs"
      - "platform/apps/worker/scripts/resilience-certification.mjs"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/tests/concurrency_certification.mjs"
      - "platform/packages/database/tests/backup_restore_seed.sql"
      - "platform/docs/concurrency-certification.md"
      - "platform/docs/gate6-performance-resilience.md"
      - "platform/pnpm-lock.yaml"
      - ".github/workflows/concurrency-certification.yml"

permissions:
  contents: read

jobs:
  certify-contention:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura_concurrency
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_concurrency
      PGPASSWORD: postgres
      GATE6_DB_BATCH_BUDGET_MS: "45000"
      GATE6_WORKER_BATCH_BUDGET_MS: "30000"
      GATE6_RESILIENCE_BUDGET_MS: "15000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Migrate PostgreSQL 18 through production runner
        run: |
          set -euo pipefail
          MIGRATION_ACTOR=concurrency-certification pnpm --filter @preneura/database migrate
          expected_count="$(find packages/database/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | wc -l | tr -d ' ')"
          actual_count="$(psql "$DATABASE_URL" -Atqc 'SELECT count(*) FROM platform_schema_migrations')"
          test "$actual_count" = "$expected_count"
          latest_file="$(find packages/database/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -1)"
          latest_version="$(printf '%s' "$latest_file" | cut -c1-4 | sed 's/^0*//')"
          latest_ledger_file="$(psql "$DATABASE_URL" -Atqc 'SELECT filename FROM platform_schema_migrations ORDER BY version DESC LIMIT 1')"
          latest_ledger_version="$(psql "$DATABASE_URL" -Atqc 'SELECT version FROM platform_schema_migrations ORDER BY version DESC LIMIT 1')"
          test "$latest_ledger_file" = "$latest_file"
          test "$latest_ledger_version" = "$latest_version"
      - name: Seed certified commercial/legal/finance baseline
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/tests/backup_restore_seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "UPDATE queue_entries SET status='COMPLETED', completed_at=now(), updated_at=now() WHERE id='00000000-0000-0000-0000-000000009000';"
      - name: Run database contention certification
        run: |
          set -euo pipefail
          node packages/database/tests/concurrency_certification.mjs | tee /tmp/database-concurrency.json
      - name: Enforce database contention time guardrails
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const budget = Number(process.env.GATE6_DB_BATCH_BUDGET_MS);
          const result = JSON.parse(await readFile('/tmp/database-concurrency.json', 'utf8'));
          if (result.status !== 'passed') throw new Error('Database contention certification did not pass.');
          for (const [name, batch] of Object.entries(result)) {
            if (name === 'status' || !batch || typeof batch !== 'object' || !('elapsedMs' in batch)) continue;
            if (Number(batch.elapsedMs) > budget) {
              throw new Error(`${name} took ${batch.elapsedMs}ms, above Gate 6 CI guardrail ${budget}ms`);
            }
          }
          console.log(JSON.stringify({ status: 'passed', budgetMs: budget }, null, 2));
          NODE
      - name: Build and run compiled worker contention certification
        run: |
          set -euo pipefail
          pnpm --filter @preneura/worker build
          node apps/worker/scripts/concurrency-certification.mjs | tee /tmp/worker-concurrency.json
      - name: Enforce worker contention time guardrail
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const budget = Number(process.env.GATE6_WORKER_BATCH_BUDGET_MS);
          const result = JSON.parse(await readFile('/tmp/worker-concurrency.json', 'utf8'));
          if (result.status !== 'passed') throw new Error('Worker contention certification did not pass.');
          if (Number(result.elapsedMs) > budget) {
            throw new Error(`Worker delivery batch took ${result.elapsedMs}ms, above Gate 6 CI guardrail ${budget}ms`);
          }
          console.log(JSON.stringify({ status: 'passed', budgetMs: budget }, null, 2));
          NODE
      - name: Run compiled worker resilience certification
        run: |
          set -euo pipefail
          node apps/worker/scripts/resilience-certification.mjs | tee /tmp/worker-resilience.json
      - name: Enforce resilience recovery time guardrail
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const budget = Number(process.env.GATE6_RESILIENCE_BUDGET_MS);
          const result = JSON.parse(await readFile('/tmp/worker-resilience.json', 'utf8'));
          if (result.status !== 'passed') throw new Error('Worker resilience certification did not pass.');
          if (Number(result.elapsedMs) > budget) {
            throw new Error(`Worker resilience drill took ${result.elapsedMs}ms, above Gate 6 CI guardrail ${budget}ms`);
          }
          console.log(JSON.stringify({ status: 'passed', budgetMs: budget }, null, 2));
          NODE
      - name: Final invariant reconciliation
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM inventory_locks WHERE status='ACTIVE' AND unit_type_id IN (SELECT id FROM catalog_unit_types WHERE code LIKE 'CONC-%')")" = '1'
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM notification_jobs WHERE template_code='concurrency.certification' AND status='SENT' AND attempts=1")" = '100'
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM finance_provider_webhook_events WHERE provider='CONCURRENCY_PROVIDER' AND provider_event_id='provider-event-001'")" = '1'
          test "$(psql "$DATABASE_URL" -Atqc "SELECT count(*) FROM finance_payment_events WHERE provider='CONCURRENCY_PROVIDER' AND provider_event_id='provider-event-001'")" = '1'
          test "$(psql "$DATABASE_URL" -Atqc "SELECT coalesce(sum(signed_amount),0) FROM finance_ledger_entries WHERE transaction_id='00000000-0000-0000-0000-000000013000'")" = '0.00'
