name: E05 Apartment Type EOI Certification

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/e05-eoi-choice-certification.yml'
  push:
    branches: ['codex/egypt-platform-completion', 'release/**']
    paths:
      - 'platform/**'
      - '.github/workflows/e05-eoi-choice-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura_eoi_certification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d preneura_eoi_certification'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_eoi_certification
      MIGRATION_ACTOR: github-e05-eoi-choice-certification
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Migrate disposable database from zero
        run: pnpm --filter @preneura/database migrate
      - name: Normal authorization and contract tests
        run: pnpm test
      - name: Build emitted API
        run: pnpm --filter @preneura/api build
      - name: Real repository choice, policy and concurrent retry certification
        run: node apps/api/scripts/certify-eoi-choice.mjs
      - name: Existing pricing, finance, document and allocator regression
        run: |
          set -Eeuo pipefail
          for suite in gate2_pricing_certification gate3_document_contract_trust_certification gate3_finance_ledger_certification gate4_finance_integration_certification gate4_settlement_ledger_certification gate4_settlement_command_authority_certification gate5_reception_allocator_certification; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "packages/database/tests/${suite}.sql"
          done
      - name: Strict typecheck
        run: pnpm typecheck
