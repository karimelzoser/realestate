name: Validate PRENEURA

on:
  push:
    branches: [main, develop, "feature/**", "refactor/**", "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and Python syntax
        run: |
          node --check src/core/product-model.js
          node --check src/core/role-policy.js
          node --check src/core/state.js
          node --check src/features/live-allocation/index.js
          node --check src/core/flow-navigation.js
          node --check src/core/router.js
          node --check src/features/buyer-experience/index.js
          node --check src/features/how-it-works/index.js
          node --check src/features/flow-preview/index.js
          node --check src/features/flow-preview/contract.js
          node --check src/features/local-voice-agent/config64.js
          node --check src/features/local-voice-agent/engine.js
          node --check src/features/local-voice-agent/audio.js
          node --check src/features/local-voice-agent/index.js
          node --check src/features/local-voice-agent/lifecycle.js
          node --check src/features/production-ops/index.js
          python3 -m py_compile local_voice_agent/server.py local_voice_agent/server64.py
      - name: Validate routes and assets
        run: node scripts/validate.mjs
      - name: Validate canonical product model
        run: node scripts/validate-model.mjs
      - name: Validate role policy
        run: node scripts/validate-role-policy.mjs
      - name: Validate shared state facade
        run: node scripts/validate-state.mjs
      - name: Validate release UX and functional contract
        run: node scripts/validate-release.mjs
      - name: Validate flow previews
        run: node scripts/validate-flow-preview.mjs
      - name: Validate local Egyptian voice agent
        run: node scripts/validate-local-voice-agent.mjs
      - name: Validate production operations
        run: node scripts/validate-production-ops.mjs
      - name: Install Chromium browser QA
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-test flows, purchase completion, voice allocation and production operations
        env:
          PRENEURA_BASE_URL: http://127.0.0.1:4173/
        run: |
          python3 -m http.server 4173 >/tmp/preneura-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          npx playwright test tests/flow-preview.spec.cjs tests/local-voice-agent.spec.cjs tests/production-ops.spec.cjs --reporter=line
