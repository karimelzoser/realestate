name: Gate 5 Manager Director Certification

on:
  pull_request:
    paths:
      - "platform/apps/api/src/management/**"
      - "platform/apps/web/app/workspace/management/**"
      - "platform/apps/web/app/workspace/workspace-operations-shortcuts.tsx"
      - "platform/packages/contracts/src/management.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/database/migrations/**"
      - "platform/scripts/certify-gate5-manager-director.mjs"
      - ".github/workflows/gate5-manager-director-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/api/src/management/**"
      - "platform/apps/web/app/workspace/management/**"
      - "platform/apps/web/app/workspace/workspace-operations-shortcuts.tsx"
      - "platform/packages/contracts/src/management.ts"
      - "platform/packages/contracts/package.json"
      - "platform/packages/database/migrations/**"
      - "platform/scripts/certify-gate5-manager-director.mjs"
      - ".github/workflows/gate5-manager-director-certification.yml"

permissions:
  contents: read

jobs:
  management-governance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura_gate5_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura_gate5_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: platform
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura_gate5_management
      PGPASSWORD: postgres
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build management authority and web control room
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          set -euo pipefail
          pnpm --filter @preneura/api... build
          pnpm --filter @preneura/web... build

      - name: Apply canonical migrations
        run: MIGRATION_ACTOR=gate5-manager-director pnpm --filter @preneura/database migrate

      - name: Certify Manager and Operations Director governance
        run: node scripts/certify-gate5-manager-director.mjs
