name: Bootstrap Observability Lockfile

on:
  push:
    branches:
      - "feature/production-observability"
    paths:
      - "platform/packages/observability/package.json"
      - "platform/apps/api/package.json"
      - "platform/apps/worker/package.json"
      - "platform/apps/notification-gateway/package.json"
      - ".github/workflows/bootstrap-observability-lockfile.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/production-observability
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile only
        working-directory: platform
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          git add platform/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(observability): lock telemetry dependencies"
          git push origin HEAD:feature/production-observability
