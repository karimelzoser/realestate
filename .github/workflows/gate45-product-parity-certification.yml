name: Gate 4-5 Product Parity Certification

on:
  pull_request:
    paths:
      - "platform/apps/**"
      - "platform/packages/contracts/**"
      - "platform/scripts/certify-role-parity.mjs"
      - ".github/workflows/gate45-product-parity-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/**"
      - "platform/packages/contracts/**"
      - "platform/scripts/certify-role-parity.mjs"
      - ".github/workflows/gate45-product-parity-certification.yml"

permissions:
  contents: read

jobs:
  product-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @preneura/contracts build
      - name: Certify role and product parity
        run: node scripts/certify-role-parity.mjs
      - name: Typecheck and production builds
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          pnpm typecheck
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/web build
