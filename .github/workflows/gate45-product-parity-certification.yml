name: Gate 4-5 Product Parity Certification

on:
  pull_request:
    paths:
      - "platform/apps/**"
      - "platform/packages/contracts/**"
      - "platform/packages/database/**"
      - "platform/scripts/certify-role-parity.mjs"
      - ".github/workflows/gate45-product-parity-certification.yml"
  push:
    branches:
      - "feature/production-*"
      - "release/**"
    paths:
      - "platform/apps/**"
      - "platform/packages/contracts/**"
      - "platform/packages/database/**"
      - "platform/scripts/certify-role-parity.mjs"
      - ".github/workflows/gate45-product-parity-certification.yml"

permissions:
  contents: read

jobs:
  product-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @preneura/contracts build
      - name: Certify role and product parity
        run: node scripts/certify-role-parity.mjs
      - name: Typecheck and production builds
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
        run: |
          pnpm typecheck
          pnpm --filter @preneura/api build
          pnpm --filter @preneura/web build

  export-projections:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: preneura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura
    steps:
      - uses: actions/checkout@v4
      - name: Apply production migrations
        run: |
          for migration in platform/packages/database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
      - name: Certify every export projection against PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f platform/packages/database/tests/gate45_export_projection_certification.sql
