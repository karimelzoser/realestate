name: Gate 4 Integrated Finance Certification

on:
  pull_request:
    paths:
      - "platform/.env.example"
      - "platform/pnpm-lock.yaml"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/scripts/migrate.mjs"
      - "platform/packages/database/tests/gate4_settlement_ledger_certification.sql"
      - "platform/packages/database/tests/gate4_settlement_command_authority_certification.sql"
      - "platform/packages/database/tests/gate4_finance_integration_certification.sql"
      - "platform/packages/database/tests/gate4_eoi_refund_finance_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/contracts/src/sales.ts"
      - "platform/packages/contracts/src/settlements.ts"
      - "platform/packages/contracts/src/commissions.ts"
      - "platform/apps/api/src/sales/**"
      - "platform/apps/api/src/settlements/**"
      - "platform/apps/api/src/commissions/**"
      - "platform/apps/web/app/workspace/settlements/**"
      - "platform/docs/eoi-refund-finance.md"
      - "platform/docs/settlement-ledger.md"
      - ".github/workflows/settlement-ledger-certification.yml"
  push:
    branches:
      - "feature/production-*"
    paths:
      - "platform/.env.example"
      - "platform/pnpm-lock.yaml"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/scripts/migrate.mjs"
      - "platform/packages/database/tests/gate4_settlement_ledger_certification.sql"
      - "platform/packages/database/tests/gate4_settlement_command_authority_certification.sql"
      - "platform/packages/database/tests/gate4_finance_integration_certification.sql"
      - "platform/packages/database/tests/gate4_eoi_refund_finance_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/contracts/src/sales.ts"
      - "platform/packages/contracts/src/settlements.ts"
      - "platform/packages/contracts/src/commissions.ts"
      - "platform/apps/api/src/sales/**"
      - "platform/apps/api/src/settlements/**"
      - "platform/apps/api/src/commissions/**"
      - "platform/apps/web/app/workspace/settlements/**"
      - "platform/docs/eoi-refund-finance.md"
      - "platform/docs/settlement-ledger.md"
      - ".github/workflows/settlement-ledger-certification.yml"

permissions:
  contents: read

jobs:
  integrated-finance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Typecheck integrated API contracts
        working-directory: platform
        run: pnpm typecheck

      - name: Apply canonical schema with production migrator
        working-directory: platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura
          MIGRATION_ACTOR: gate4-integrated-finance-certification
        run: pnpm --filter @preneura/database migrate

      - name: Verify canonical Gate 4 migration history and authority
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_latest integer;
          BEGIN
            SELECT max(version) INTO v_latest FROM platform_schema_migrations;
            IF v_latest <> 39 THEN
              RAISE EXCEPTION 'production migrator did not finish at integrated schema 39; got %', v_latest;
            END IF;

            IF EXISTS (
              SELECT 1 FROM platform_schema_migrations
              WHERE filename !~ '^[0-9]{4}_[a-z0-9_]+[.]sql$'
            ) THEN
              RAISE EXCEPTION 'noncanonical migration entered production history';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=34 AND filename='0034_settlement_disbursement_ledger.sql')
              THEN RAISE EXCEPTION 'settlement ledger migration 0034 missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=35 AND filename='0035_settlement_state_authority.sql')
              THEN RAISE EXCEPTION 'settlement authority migration 0035 missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=36 AND filename='0036_settlement_command_authority.sql')
              THEN RAISE EXCEPTION 'settlement command migration 0036 missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=37 AND filename='0037_eoi_financial_evidence.sql')
              THEN RAISE EXCEPTION 'EOI finance migration 0037 missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=38 AND filename='0038_eoi_projection_guards_fail_closed.sql')
              THEN RAISE EXCEPTION 'EOI projection guard migration 0038 missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM platform_schema_migrations WHERE version=39 AND filename='0039_eoi_projection_authority_one_shot.sql')
              THEN RAISE EXCEPTION 'EOI/settlement integration migration 0039 missing'; END IF;

            IF to_regclass('public.settlement_disbursements') IS NULL
              OR to_regclass('public.settlement_events') IS NULL
              OR to_regclass('public.settlement_ledger_entries') IS NULL
              THEN RAISE EXCEPTION 'settlement authority structures missing'; END IF;
            IF to_regclass('public.eoi_finance_events') IS NULL
              OR to_regclass('public.eoi_finance_ledger_entries') IS NULL
              THEN RAISE EXCEPTION 'EOI finance structures missing'; END IF;

            IF to_regprocedure('public.preneura_pay_eoi_refund(uuid,uuid,uuid,text,uuid,timestamp with time zone)') IS NOT NULL
              THEN RAISE EXCEPTION 'obsolete direct EOI payout authority still exists'; END IF;
            IF to_regprocedure('public.preneura_record_eoi_settlement_subledger()') IS NULL
              THEN RAISE EXCEPTION 'settlement-to-EOI accounting bridge missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='trg_eoi_settlement_subledger' AND NOT tgisinternal
            ) THEN RAISE EXCEPTION 'settlement-to-EOI accounting trigger missing'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM platform_runtime_contract
              WHERE singleton_key='production'
                AND schema_version=39
                AND minimum_runtime_version=39
                AND migration_marker='0039_eoi_projection_authority_one_shot'
            ) THEN RAISE EXCEPTION 'runtime contract is not integrated Gate 4 schema 39'; END IF;
          END $$;
          SQL

      - name: Execute settlement command authority certification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 \
            -f platform/packages/database/tests/gate4_settlement_command_authority_certification.sql

      - name: Execute commission settlement certification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 \
            -f platform/packages/database/tests/gate4_settlement_ledger_certification.sql

      - name: Execute integrated EOI/refund settlement certification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 \
            -f platform/packages/database/tests/gate4_finance_integration_certification.sql
