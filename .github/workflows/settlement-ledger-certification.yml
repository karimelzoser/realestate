name: Gate 4 Settlement Ledger Certification

on:
  pull_request:
    paths:
      - "platform/.env.example"
      - "platform/pnpm-lock.yaml"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/scripts/migrate.mjs"
      - "platform/packages/database/tests/gate4_settlement_ledger_certification.sql"
      - "platform/packages/database/tests/gate4_settlement_command_authority_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/contracts/src/settlements.ts"
      - "platform/packages/contracts/src/commissions.ts"
      - "platform/apps/api/src/settlements/**"
      - "platform/apps/api/src/commissions/**"
      - "platform/apps/web/app/workspace/settlements/**"
      - "platform/docs/settlement-ledger.md"
      - ".github/workflows/settlement-ledger-certification.yml"
  push:
    branches:
      - "feature/production-*"
    paths:
      - "platform/.env.example"
      - "platform/pnpm-lock.yaml"
      - "platform/packages/database/migrations/**"
      - "platform/packages/database/scripts/migrate.mjs"
      - "platform/packages/database/tests/gate4_settlement_ledger_certification.sql"
      - "platform/packages/database/tests/gate4_settlement_command_authority_certification.sql"
      - "platform/packages/database/src/runtime-readiness.ts"
      - "platform/packages/contracts/src/access.ts"
      - "platform/packages/contracts/src/settlements.ts"
      - "platform/packages/contracts/src/commissions.ts"
      - "platform/apps/api/src/settlements/**"
      - "platform/apps/api/src/commissions/**"
      - "platform/apps/web/app/workspace/settlements/**"
      - "platform/docs/settlement-ledger.md"
      - ".github/workflows/settlement-ledger-certification.yml"

permissions:
  contents: read

jobs:
  outgoing-settlements:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: preneura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preneura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Frozen install
        working-directory: platform
        run: pnpm install --frozen-lockfile

      - name: Apply schema with production migrator
        working-directory: platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preneura
          MIGRATION_ACTOR: gate4-settlement-certification
        run: pnpm --filter @preneura/database migrate

      - name: Verify settlement authority structures
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_latest integer;
          BEGIN
            SELECT max(version) INTO v_latest FROM platform_schema_migrations;
            IF v_latest <> 36 THEN
              RAISE EXCEPTION 'production migrator did not finish at settlement schema 36; got %', v_latest;
            END IF;

            IF EXISTS (
              SELECT 1 FROM platform_schema_migrations
              WHERE filename !~ '^[0-9]{4}_[a-z0-9_]+[.]sql$'
            ) THEN
              RAISE EXCEPTION 'noncanonical migration entered production settlement history';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM platform_schema_migrations
              WHERE version = 34 AND filename = '0034_settlement_disbursement_ledger.sql'
            ) THEN RAISE EXCEPTION 'settlement ledger migration missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM platform_schema_migrations
              WHERE version = 35 AND filename = '0035_settlement_state_authority.sql'
            ) THEN RAISE EXCEPTION 'settlement state-authority migration missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM platform_schema_migrations
              WHERE version = 36 AND filename = '0036_settlement_command_authority.sql'
            ) THEN RAISE EXCEPTION 'settlement command-authority migration missing'; END IF;

            IF to_regclass('public.settlement_disbursements') IS NULL
              THEN RAISE EXCEPTION 'settlement disbursement table missing'; END IF;
            IF to_regclass('public.settlement_events') IS NULL
              THEN RAISE EXCEPTION 'settlement event table missing'; END IF;
            IF to_regclass('public.settlement_ledger_entries') IS NULL
              THEN RAISE EXCEPTION 'settlement ledger table missing'; END IF;
            IF to_regclass('public.settlement_provider_events') IS NULL
              THEN RAISE EXCEPTION 'settlement provider inbox missing'; END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_settlement_events_immutable' AND NOT tgisinternal)
              THEN RAISE EXCEPTION 'settlement event immutability trigger missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_settlement_ledger_immutable' AND NOT tgisinternal)
              THEN RAISE EXCEPTION 'settlement ledger immutability trigger missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_settlement_terminal_evidence' AND NOT tgisinternal)
              THEN RAISE EXCEPTION 'settlement state evidence trigger missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_eoi_refund_paid_by_settlement' AND NOT tgisinternal)
              THEN RAISE EXCEPTION 'refund paid-state authority trigger missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='trg_commission_paid_by_settlement' AND NOT tgisinternal)
              THEN RAISE EXCEPTION 'commission paid-state authority trigger missing'; END IF;

            IF to_regprocedure('public.preneura_create_eoi_refund_settlement(uuid,uuid,text,timestamp with time zone)') IS NULL
              THEN RAISE EXCEPTION 'EOI settlement creation function missing'; END IF;
            IF to_regprocedure('public.preneura_create_commission_settlement(uuid,uuid,text,timestamp with time zone)') IS NULL
              THEN RAISE EXCEPTION 'commission settlement creation function missing'; END IF;
            IF to_regprocedure('public.preneura_submit_settlement(uuid,uuid,text,text,timestamp with time zone)') IS NULL
              THEN RAISE EXCEPTION 'settlement submission function missing'; END IF;
            IF to_regprocedure('public.preneura_apply_settlement_outcome(uuid,text,uuid,text,text,text,timestamp with time zone,jsonb)') IS NULL
              THEN RAISE EXCEPTION 'settlement outcome function missing'; END IF;

            IF NOT EXISTS (
              SELECT 1 FROM platform_runtime_contract
              WHERE singleton_key='production'
                AND schema_version = 36
                AND minimum_runtime_version = 36
                AND migration_marker = '0036_settlement_command_authority'
            ) THEN
              RAISE EXCEPTION 'runtime contract is not settlement schema 36';
            END IF;
          END $$;
          SQL

      - name: Execute payout reconciliation certification
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 \
            -f platform/packages/database/tests/gate4_settlement_ledger_certification.sql

      - name: Execute settlement command-authority certification
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d preneura -v ON_ERROR_STOP=1 \
            -f platform/packages/database/tests/gate4_settlement_command_authority_certification.sql
