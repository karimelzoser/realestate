services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: preneura
      POSTGRES_USER: preneura
      POSTGRES_PASSWORD: preneura-certification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preneura -d preneura"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - certification-postgres:/var/lib/postgresql
    networks:
      - backend

volumes:
  certification-postgres:
