name: realestate-os-testing
services:
  object-storage:
    image: chrislusf/seaweedfs:4.48
    user: '1000:1000'
    command: ['server','-dir=/data','-ip=object-storage','-ip.bind=0.0.0.0','-volume.port=8081','-volume.max=4','-master.volumeSizeLimitMB=1024','-s3','-s3.port=8333','-s3.config=/etc/seaweedfs/s3.json']
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: '0.25'
    pids_limit: 128
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    working_dir: /data
    volumes:
      - ./seaweed-s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweed-filer.toml:/etc/seaweedfs/filer.toml:ro
      - object-data:/data
    tmpfs: ['/tmp:size=32m']
    expose: ['8333']
    networks: [backend]
networks:
  backend:
    external: true
    name: realestate-os-testing_backend
volumes:
  object-data:
    name: realestate-os-testing_object-data
