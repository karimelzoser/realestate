Foreground yes
LogTime yes
LogClean no
LogVerbose no
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 2
MaxConnectionQueueLength 5
StreamMaxLength 32M
MaxFileSize 32M
MaxScanSize 64M
MaxRecursion 16
AlertExceedsMax yes
AlertEncrypted yes
SelfCheck 3600
ConcurrentDatabaseReload no
