worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_certificate /etc/letsencrypt/live/realestate-test.aipreneura.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/realestate-test.aipreneura.com/privkey.pem;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream app_web { server web:3000; keepalive 8; }
  upstream app_api { server api:4100; keepalive 16; }
  upstream app_identity { server identity:8080; keepalive 8; }
  upstream object_store { server object-storage:8333; keepalive 8; }
  server {
    listen 8443 ssl;
    server_name realestate-test.aipreneura.com;
    if ($host != realestate-test.aipreneura.com) { return 444; }
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /healthz { proxy_pass http://app_api/v1/health/ready; }
    location = /livez { proxy_pass http://app_api/v1/health/live; }
    location ^~ /identity/admin/ { return 404; }
    location ^~ /identity/realms/master/ { return 404; }
    location ^~ /identity/health { return 404; }
    location ^~ /identity/metrics { return 404; }
    location ^~ /identity/ {
      proxy_pass http://app_identity;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/ {
      proxy_pass http://app_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
    location / {
      proxy_pass http://app_web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
  server {
    listen 8444 ssl;
    server_name realestate-test.aipreneura.com;
    if ($host != realestate-test.aipreneura.com) { return 444; }
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
      proxy_pass http://object_store;
      proxy_http_version 1.1;
      # Signed S3 requests include the public port. Preserve Host and raw URI.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
